name: Aztec Network

image: https://cdn.prod.website-files.com/6847005bc403085c1aa846e0/689cacb514469cdab7b6c2cf_Aztec-cover.png

description: Aztec Network is a decentralized, privacy‑preserving layer‑2 scaling solution on Ethereum. It enables developers to build applications
  with end‑to‑end privacy using its Noir programming language and zero‑knowledge proofs. The network focuses on composable privacy, programmable
  proof systems, and open‑source tooling, aiming to bring confidential smart contracts and private transactions to mainstream blockchain use cases.

